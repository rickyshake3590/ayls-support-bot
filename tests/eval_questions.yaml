# Retrieval eval set. Drafted from content/ (site repo) at phase 4.
# expect:      substring that must appear (case-insensitive) in one of the retrieved chunks
# expect_none: true means retrieval must return nothing (off-topic questions)

# --- Fees, cost and registration ---
- question: "What is the registration fee?"
  expect: "SGD 300"
- question: "How much does the summit cost?"
  expect: "SGD 300"
- question: "What does the fee cover?"
  expect: "Accommodation for 2 nights"
- question: "Are optional tours covered by the fee?"
  expect: "Optional tours"
- question: "Are there grants to reduce the fees?"
  expect: "volunteer roles"

